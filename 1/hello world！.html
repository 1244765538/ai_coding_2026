<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>霓虹风 Hello World</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0d0d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            color: #fff;
            font-size: 4rem;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.8; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
            to { opacity: 1; text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff, 0 0 120px #0ff; }
        }
    </style>
</head>
<body>
<h1>Hello, World!</h1>
</body>
</html>
